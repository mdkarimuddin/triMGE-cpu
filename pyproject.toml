[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trimge-cpu"
version = "0.1.0"
description = "triMGE-cpu: CPU-only k-mer SVM classification of phage, phage-plasmid, and plasmid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Md Karim Uddin" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.8,<1.9",
  "joblib>=1.3",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
report = ["matplotlib>=3.7"]

[project.scripts]
trimge-cpu = "trimgecpu.cli:main"
trimge-cpu-report = "trimgecpu.report.cli:main"
trimge-cpu-combine = "trimgecpu.combine_cli:main"
trimge-cpu-pipeline = "trimgecpu.easy_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
